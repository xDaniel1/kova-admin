<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Kova Tower</title>
<meta name="description" content="Kova Tower, the internal console for Kova Maps.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232f6fe4'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='17' fill='white' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fbumdslhguoytlhlrkyr.supabase.co" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="modulepreload" href="./js/app.js">
<link rel="modulepreload" href="./js/util.js">
<link rel="modulepreload" href="./js/api.js">
<link rel="modulepreload" href="./js/icons.js">
<link rel="modulepreload" href="./js/records.js">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"></noscript>
<link rel="stylesheet" href="./styles.css">
<script>
// Apply the saved theme before first paint so there is no flash.
try { const t = localStorage.getItem('tower-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
</script>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
<script defer src="./config.js"></script>
<script type="module" src="./js/app.js"></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div id="app">
  <aside id="sidebar" aria-label="Navigation">
    <a class="brand" href="#/"><span class="brand-mark" aria-hidden="true">K</span><span class="brand-name">Kova Tower</span></a>
    <nav id="nav" aria-label="Sections"></nav>
    <div class="sidebar-foot">
      <p class="muted small" id="signed-in"></p>
      <button id="signout" type="button" class="ghost">Sign out</button>
    </div>
  </aside>
  <button id="scrim" type="button" aria-label="Close menu" hidden></button>
  <div id="frame">
    <header id="topbar">
      <button id="menu" type="button" class="icon" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false"></button>
      <h1 id="page-title">Kova Tower</h1>
      <form id="search-form" role="search"><input id="search" type="search" placeholder="Search users, feedback, venues…" aria-label="Search everything" autocomplete="off"></form>
      <button id="theme" type="button" class="icon" aria-label="Toggle dark mode"></button>
    </header>
    <div id="banner" role="alert" hidden></div>
    <div id="role-note" hidden>You have read-only access. Ask an owner if you need to make changes.</div>
    <p id="notice" role="status" aria-live="polite" hidden></p>
    <main id="main" tabindex="-1">
      <section id="login" class="card login" hidden>
        <div class="login-brand"><span class="brand-mark" aria-hidden="true">K</span><span class="eyebrow">Kova Maps</span></div>
        <h2>Sign in to Tower</h2>
        <p class="muted">Internal console for Kova Maps. Access is checked on the server; only listed admins get past this screen.</p>
        <button type="button" id="google-signin" class="primary">Sign in with Google</button>
        <form id="login-form" class="stack">
          <p class="muted small">Or get a one-time link by email:</p>
          <label>Email<input id="email" type="email" autocomplete="email" required></label>
          <button id="send-link">Send magic link</button>
        </form>
      </section>
      <div id="outlet"></div>
    </main>
  </div>
</div>
</body>
</html>
